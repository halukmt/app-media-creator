name: CI

# Only on PRs: the PR run already checks the exact state that is merged, so a second run on the
# push to dev would only spend Actions minutes. Manual runs stay possible.
on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

# A new push to the same PR cancels the older run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: '24'

jobs:
  # Decides whether the heavy jobs run. Pure documentation PRs still get a green result,
  # because skipped jobs count as successful (the /next-issue loop waits for green checks).
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        name: Docs only?
        run: |
          DOCS='^[^/]+\.md$|^docs/|^openspec/|^\.claude/|^\.github/ISSUE_TEMPLATE/|^\.github/pull_request_template\.md$|^\.github/copilot-instructions\.md$'
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "$changed"
          code=$(echo "$changed" | grep -vE "$DOCS" || true)
          if [ -n "$code" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi

  checks:
    name: Checks, unit tests and build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # The video tests render real previews with ffmpeg and measure them with ffprobe.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Type check
        run: npm run check
      - name: Project checks
        run: npm run check:all
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    name: Playwright with axe
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  release-gate:
    name: Release gate
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: CHANGELOG and version
        run: node scripts/check-release.mjs

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
